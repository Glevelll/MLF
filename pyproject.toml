[project]
name = "mlf-student-performance"
version = "1.0.0"
description = "Мультиагентная система прогноза успеваемости студентов (MLF-2026, задание №9)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.6",
    "xgboost-cpu>=2.1; (sys_platform == 'win32' and platform_machine == 'AMD64') or (sys_platform == 'linux' and platform_machine == 'x86_64')",
    "xgboost>=2.1; (sys_platform != 'win32' or platform_machine != 'AMD64') and (sys_platform != 'linux' or platform_machine != 'x86_64')",
    "statsmodels>=0.14",
    "pyarrow>=16",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "pyjwt>=2.8",
    "email-validator>=2.1",
    "bcrypt>=4.1",
    "tiktoken>=0.7",
    "celery>=5.4",
    "redis>=5.0",
    "qdrant-client>=1.10",
    "matplotlib>=3.8",
    "tabulate>=0.9",
]

[project.optional-dependencies]
ui = ["gradio>=6.0,<7", "plotly>=5.20"]
hf = ["transformers>=4.44", "torch>=2.3", "accelerate>=0.34"]
st = ["sentence-transformers>=3.0"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0", "respx>=0.21", "ruff>=0.5"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
frontend = ["styles.css"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.coverage.run]
source = ["backend"]
omit = ["backend/db/migrations/*", "backend/core/llm/providers/hf_local.py"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
