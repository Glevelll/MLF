# Продакшен-окружение: docker compose up -d --build
# Первичная загрузка данных: docker compose run --rm app sh -c "python scripts/download_data.py && \
#   python scripts/generate_glossary.py && python scripts/generate_knowledge_base.py && python scripts/import_data.py"
x-app-env: &app-env
  MLF_APP_ENV: prod
  MLF_DATA_DIR: /app/data
  MLF_DATABASE_URL: postgresql+asyncpg://mlf:${POSTGRES_PASSWORD:-mlf}@db:5432/mlf
  MLF_REDIS_URL: redis://redis:6379/0
  MLF_TASK_BACKEND: celery
  MLF_CACHE_BACKEND: redis
  MLF_VECTOR_BACKEND: qdrant
  MLF_QDRANT_URL: http://qdrant:6333
  MLF_LLM_PROVIDER: ${MLF_LLM_PROVIDER:-ollama}
  MLF_LLM_MODEL: ${MLF_LLM_MODEL:-qwen2.5:7b}
  MLF_OLLAMA_URL: http://ollama:11434
  MLF_JWT_SECRET: ${MLF_JWT_SECRET:?set MLF_JWT_SECRET in .env}

services:
  app:
    build: .
    environment: *app-env
    volumes: [appdata:/app/data]
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
      qdrant: {condition: service_started}
    restart: unless-stopped

  worker:
    build: .
    command: celery -A backend.worker.celery_app worker --loglevel=INFO --concurrency=2
    environment: *app-env
    volumes: [appdata:/app/data]
    depends_on: [app, redis]
    restart: unless-stopped

  beat:
    build: .
    command: celery -A backend.worker.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    environment: *app-env
    depends_on: [redis]
    restart: unless-stopped

  frontend:
    build: .
    command: python -m frontend.app
    environment:
      MLF_API_URL: http://app:8000
      MLF_UI_HOST: 0.0.0.0
    depends_on: [app]
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mlf
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mlf}
      POSTGRES_DB: mlf
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlf"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine

  qdrant:
    image: qdrant/qdrant:v1.12.4
    volumes: [qdrant:/qdrant/storage]

  ollama:
    image: ollama/ollama:0.5.7
    volumes: [ollama:/root/.ollama]
    # GPU: раскомментируйте при наличии NVIDIA Container Toolkit
    # deploy: {resources: {reservations: {devices: [{driver: nvidia, count: 1, capabilities: [gpu]}]}}}

  nginx:
    image: nginx:1.27-alpine
    ports: ["80:80"]
    volumes: [./infrastructure/nginx.conf:/etc/nginx/conf.d/default.conf:ro]
    depends_on: [app, frontend]

volumes:
  appdata:
  pgdata:
  qdrant:
  ollama:
