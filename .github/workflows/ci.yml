name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install ".[dev,ui]"
      - name: Lint
        run: ruff check backend frontend scripts tests
      - name: Download data
        run: python scripts/download_data.py
      - name: Tests
        run: pytest --cov=backend --cov-report=term --cov-fail-under=70

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mlf-student-performance .
      - run: MLF_JWT_SECRET=ci docker compose config -q
